plugins {
    id 'swdb.java-conventions'
}

dependencies {
    api project(':swdb-storage')
    implementation platform(libs.jackson.bom)
    implementation libs.jackson.databind
}

tasks.named('test', Test) {
    // Полный classpath для отдельной JVM в тесте аварийного восстановления.
    systemProperty 'swdb.test.classpath', sourceSets.test.runtimeClasspath.asPath
}
