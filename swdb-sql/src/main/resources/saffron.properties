# Настройки Apache Calcite: он читает этот файл из classpath при первой загрузке своих классов.
# По умолчанию строки в Calcite в ISO-8859-1, и литерал 'ёжик' не проходит дальше парсера.
# UTF-8 позволяет хранить любые символы Unicode, как text в PostgreSQL.
calcite.default.charset=UTF-8
calcite.default.nationalcharset=UTF-8
calcite.default.collation.name=UTF-8$en_US
